<!DOCTYPE html>
<html>
    <head>
        <title>
            Learning about Fetch
        </title>
    </head>


<body>
    <h1>
        Learning about Fetch
    </h1>

    <ul id="catFacts">

    </ul>




    <script>
        // JSON

        var simpleObject = {
            'name': 'Joel',
            'role': 'Faculty'

        }

        console.log(simpleObject);

        var catFacts = [
            "Joel is not a fan of cats",
            "Joel is allergic to cats",
        ];

        function renderList(){


            const ulElement = document.getElementById("catFacts");
            catFacts.forEach(fact => {
                const li = document.createElement("li");
                li.textContent = fact;
                ulElement.appendChild(li);
            });
        }

        function getCatFacts(count){
            fetch(`https://meowfacts.herokuapp.com/?count=${count}`)
            .then(response => response.json())
            .then(function(data){
                catFacts = data.data;
                renderList();
            });
        }

        //renderList();

        getCatFacts(1);

        function getDogBreeds(){
            // Get first 10 breeds
            fetch('https://dogapi.dog/api/v2/breeds?page[size]=10')
            .then(response => response.json())
            .then(function(data){
               var DogBreed = data.data; //thus is an array of dog breed objects
               
               console.log(DogBreed[0]);
               console.log(DogBreed[0].attributes.name); //access the name of the first breed
               console.log(DogBreed[0].attributes.description);
               console.log(DogBreed[0].attributes.female_weight.max);
            });
        }


        getDogBreeds();
    </script>

</body>
</html>
